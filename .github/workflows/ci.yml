name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: iOS (Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: '26.6'
            runner: macos-26
            developer_dir: /Applications/Xcode_26.6.app/Contents/Developer
            simulator_os: '26.5'
          - xcode: '27.0'
            runner: xcode-27
            developer_dir: /Applications/Xcode_27.app/Contents/Developer
            simulator_os: '27.0'
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
      SIMULATOR_OS: ${{ matrix.simulator_os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Start the iOS Simulator before building
        timeout-minutes: 2
        run: |
          runtime="com.apple.CoreSimulator.SimRuntime.iOS-${SIMULATOR_OS//./-}"
          simulator_id="$(xcrun simctl create "WebKitTestWorkarounds CI" com.apple.CoreSimulator.SimDeviceType.iPhone-17 "$runtime")"
          echo "SIMULATOR_UDID=${simulator_id}" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_id"
      - name: Build for iOS
        run: |
          xcodebuild build -scheme WebKitTestWorkarounds \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DeviceDerivedData" \
            CODE_SIGNING_ALLOWED=NO
      - name: Build documentation
        run: |
          xcodebuild docbuild -scheme WebKitTestWorkarounds \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DeviceDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_DOCC_FLAGS='--warnings-as-errors --analyze --experimental-documentation-coverage --coverage-summary-level detailed'
      - name: Wait for the iOS Simulator
        timeout-minutes: 5
        run: xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Test on iOS Simulator
        run: |
          xcodebuild test -scheme WebKitTestWorkarounds \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/SimulatorDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult"
      - name: Delete the test Simulator
        if: always() && env.SIMULATOR_UDID != ''
        timeout-minutes: 2
        run: xcrun simctl delete "$SIMULATOR_UDID"
      - name: Preserve failed test diagnostics
        if: always() && (failure() || cancelled())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-xcode-${{ matrix.xcode }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/TestResults.xcresult
            ${{ runner.temp }}/SimulatorDerivedData/Logs/Test
            ${{ runner.temp }}/DeviceDerivedData/Logs/Build
          if-no-files-found: warn
          retention-days: 7

  test-macos:
    name: macOS (Xcode 27.1)
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Test on macOS
        run: |
          xcodebuild test -scheme WebKitTestWorkarounds \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/MacDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/MacTestResults.xcresult"
      - name: Preserve failed test diagnostics
        if: always() && (failure() || cancelled())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-macos-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/MacTestResults.xcresult
            ${{ runner.temp }}/MacDerivedData/Logs/Test
          if-no-files-found: warn
          retention-days: 7
